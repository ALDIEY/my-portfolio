services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Gives Jenkins access to the host Docker daemon so pipeline steps
      # can run `docker build`/`docker push`. This is effectively root-
      # equivalent access to the host - fine for local/personal use, but
      # not something to expose on a shared or internet-facing machine.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
